    <title>Arul Loomba - Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #000000;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .nav-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 15px 0;
            border-bottom: 1px solid #ffffff;
            box-shadow: 0 2px 20px rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .nav-title {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.3em;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        #terminal-wrapper {
            margin-top: 100px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 100px);
        }

        .terminal-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out;
        }

        .terminal-header h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .terminal-header p {
            color: #cccccc;
            opacity: 0.8;
            font-size: 1.1em;
        }

        .terminal-content {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        #terminal-container {
            background: #000000;
            border: 1px solid #ffffff;
            border-radius: 12px;
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 25px;
            backdrop-filter: blur(10px);
            min-width: 700px;
            max-width: 700px;
            min-height: 500px;
            max-height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            cursor: text;
            transition: all 0.3s ease;
        }

        #terminal-container:hover {
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            background: #000000;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-line {
            display: flex;
            align-items: center;
            background: #000000;
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ffffff;
        }

        .autocomplete-container {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .prompt {
            color: #ffffff;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.2em;
        }

        #commandInput {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: "Fira Code", monospace;
            outline: none;
            width: 100%;
            caret-color: #ffffff;
        }

        #command-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            max-width: 300px;
            width: 100%;
        }

        #command-bar button {
            background: #ffffff;
            border: 1px solid #000000;
            color: #000000;
            font-family: "Fira Code", monospace;
            font-weight: bold;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        #command-bar button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.1), transparent);
            transition: left 0.5s;
        }

        #command-bar button:hover::before {
            left: 100%;
        }

        #command-bar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
            background: #f0f0f0;
        }

        #command-bar button:active {
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .nav-content {
                padding: 0 20px;
            }

            .terminal-content {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            #terminal-container {
                min-width: unset;
                max-width: 100%;
                width: 100%;
            }

            #command-bar {
                max-width: 100%;
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .terminal-header h1 {
                font-size: 2em;
            }
        }
    </style>

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="2d866edd-cb4c-4a8e-90b2-f2152ce0a813"></script>
</head>
<body>
    <nav class="nav-container">
        <div class="nav-content">
            <span class="nav-title">Arul Loomba Portfolio</span>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Terminal</a>
                <a href="projects.html" class="nav-link">Projects: Extended</a>
            </div>
        </div>
    </nav>

    <div id="terminal-wrapper">
        <div class="terminal-header">
            <h1>Welcome to My Terminal</h1>
            <p>Type 'help' to see available commands or click the buttons below</p>
        </div>
        
        <div class="terminal-content">
            <div id="terminal-container">
                <div id="terminal">
                    <div id="output"></div>
                </div>
                <div class="input-line">
                    <div class="autocomplete-container">
                        <span class="prompt">λ</span>
                        <input type="text" id="commandInput" autocomplete="off" spellcheck="false" placeholder="Enter command...">
                        <span id="inputMirror"></span>
                        <span id="autocompleteHint"></span>
                    </div>
                </div>
            </div>
            <div id="command-bar"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
